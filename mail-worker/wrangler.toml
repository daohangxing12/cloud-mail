name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true
workers_dev = false
preview_urls = false

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail-db"
database_id = "4fcbeda4-da5a-4577-9b16-e50fe8dfb78c"

[[kv_namespaces]]
binding = "kv"
id = "03025afe3e0b41acb7bf103c4d472b91"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["*/30 * * * *", "0 16 * * *"]

[vars]
ai_model = ""
analysis_cache = false
orm_log = false
domain = ["orz.gay", "212202.xyz", "feilong168.com", "baofa.de", "ntmcn.com"]
admin = "admin@orz.gay"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
